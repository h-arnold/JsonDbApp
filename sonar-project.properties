# SonarQube / SonarCloud project configuration for JsonDbApp.
#
# This file is read by the SonarCloud scanner (GitHub App / automatic analysis) and
# governs how the project is analysed. The project key is bound to the
# h-arnold_JsonDbApp component on sonarcloud.io.
#
# Keep this file in sync with eslint.config.js: any path listed in sonar.exclusions
# must also appear in the ESLint `ignores` block so the local and remote gates
# agree on what is and is not in scope.

# --- Project identity --------------------------------------------------------
sonar.projectKey=h-arnold_JsonDbApp
sonar.projectName=JsonDbApp
sonar.projectVersion=0.1.1

# --- Source layout -----------------------------------------------------------
# GAS sources live under src/ (loaded as classic scripts). Tests live under
# tests/. Both are scanned; node_modules and generated artefacts are not.
sonar.sources=src
sonar.tests=tests
sonar.language=js
sonar.sourceEncoding=UTF-8

# --- Exclusions --------------------------------------------------------------
# Format: comma-separated glob patterns, applied to the source and test trees.
#
# Each entry below is annotated with the reason it is excluded. The exclusion
# must be defensible: the file is testing/tooling infrastructure that is not
# production code, or it triggers a known false positive that the team has
# consciously accepted.
#
# IMPORTANT: new-code exclusions are NOT permitted by the SonarCloud default
# quality gate. The exclusions below are for tooling that has been excluded
# historically; any NEW production code must be kept in-scope.

sonar.exclusions=\
  # Google Apps Script service stubs and recording fixtures for the test harness.
  # These mock the GAS runtime surface (DriveApp, PropertiesService, etc.) and
  # have no production behaviour worth analysing.
  **/gas-api-recording.json,\
  # The legacy-script loader used by tests/setup and the bench harness. It calls
  # vm.runInThisContext to load classic (non-module) GAS sources into the
  # current context exactly as the Apps Script runtime would. Sonar's
  # javascript:S1523 (dynamic code execution) is a false positive here because
  # the source path is always resolved relative to the repository root and
  # only ever points at first-party, trusted files under src/. Excluding the
  # whole file is cleaner than per-line NOSONAR markers and keeps the
  # exclusion audit trail in one place.
  tools/gas-mocks/legacy-boot.cjs

# --- Test file patterns ------------------------------------------------------
sonar.test.inclusions=tests/**

# --- Coverage (uncomment when coverage is wired into CI) ---------------------
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
